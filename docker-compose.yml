version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: nth_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=threat_hunter
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PYTHONPATH=/app
    depends_on:
      - postgres
    volumes:
      - ./tests:/app/tests:ro
      - ./datasets:/app/datasets:ro
    networks:
      - nth_network

  frontend:
    build:
      context: ./frontend
    container_name: nth_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - nth_network
    # Expose the source code for hot reloading
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:15
    container_name: nth_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: threat_hunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nth_network

volumes:
  pgdata:

networks:
  nth_network:
    driver: bridge
